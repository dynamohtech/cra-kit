name: Live data

# Runs the scanner against the real OSV.dev API and CISA KEV feed, so that
# upstream format changes are caught even when the code does not change.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Live tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -rs tests/test_live.py | tee live.txt
          # Fail if any live test was skipped instead of run.
          if grep -qE "[0-9]+ skipped" live.txt; then echo "Live tests were skipped"; exit 1; fi
          grep -E "passed" live.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"
        env:
          CRA_KIT_LIVE: "1"
      - name: Scan a fixture project against live data
        run: cra-kit scan tests/fixtures/npm-v1 --format markdown
